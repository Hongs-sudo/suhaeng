<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4844">
<meta name="robots" content="noindex">
<title>수행평가 학습 리포트 · 수학도서관</title>
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="css/report.css?v=5">
<style>
  html,body{margin:0;background:#EEF0EE;color:#1C2826;font-family:"Noto Sans KR",sans-serif;color-scheme:light}
  .wrap{max-width:820px;margin:0 auto;padding:0}
  @media (min-width:840px){.wrap{padding:24px 0}.wrap .rep{box-shadow:0 10px 30px rgba(0,0,0,.15)}}
  .msg{padding:60px 20px;text-align:center;color:#66716D}
  .topbtn{max-width:820px;margin:0 auto;display:flex;justify-content:flex-end;padding:10px 12px 0}
  .topbtn button{font:inherit;font-size:13px;border:1px solid #0A4844;color:#0A4844;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<div class="topbtn" id="bar" hidden><button id="save">이미지로 저장</button></div>
<div class="wrap" id="root"><p class="msg">리포트를 불러오는 중입니다…</p></div>
<script src="config.js?v=1"></script>
<script type="module">
  import { renderReport, reportToBlob } from "./js/report.js?v=5";
  const root = document.getElementById("root");
  const id = new URLSearchParams(location.search).get("id");
  async function load() {
    const C = window.APP_CONFIG, PID = C.programId || "suhaeng";
    if (!id) throw new Error("링크가 올바르지 않습니다.");
    if (!C.firebase || !C.firebase.apiKey) {
      const s = JSON.parse(localStorage.getItem("suhaeng-demo-v1") || "null");
      return s && s.reports && s.reports[id];
    }
    const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [{ initializeApp }, fs] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js")]);
    const db = fs.getFirestore(initializeApp(C.firebase));
    const snap = await fs.getDoc(fs.doc(db, "programs", PID, "reports", id));
    return snap.exists() ? snap.data() : null;
  }
  load().then(d => {
    if (!d) { root.innerHTML = '<p class="msg">리포트를 찾을 수 없습니다. 학원에 문의해 주세요.</p>'; return; }
    document.title = `${d.student.name} 학생 수행평가 리포트 · 수학도서관`;
    root.innerHTML = renderReport(d);
    const bar = document.getElementById("bar"); bar.hidden = false;
    document.getElementById("save").onclick = async e => {
      e.target.disabled = true; e.target.textContent = "만드는 중…";
      try { const b = await reportToBlob(d); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${d.student.name}_수행평가_리포트.png`; a.click(); }
      finally { e.target.disabled = false; e.target.textContent = "이미지로 저장"; }
    };
  }).catch(e => { root.innerHTML = `<p class="msg">리포트를 불러오지 못했습니다.<br><small>${String(e.message).replace(/</g, "&lt;")}</small></p>`; });
</script>
</body>
</html>
